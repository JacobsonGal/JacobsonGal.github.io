<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="45%" stop-color="#0a1f33"/>
      <stop offset="100%" stop-color="#102a45"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#2a8fc4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a8fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#5ec8e8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5ec8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="55%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#7dd3fc" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="hex" width="56" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(1.2)">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.08"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#hex)"/>
  <rect width="1920" height="1080" fill="url(#glowL)"/>
  <rect width="1920" height="1080" fill="url(#glowR)"/>
  <rect width="1920" height="1080" fill="url(#core)"/>
  <!-- Circuit traces -->
  <g stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.35" filter="url(#blur)">
    <path d="M0 420 H320 L380 360 H620 L700 480 H960 L1040 380 H1280 L1360 520 H1920"/>
    <path d="M0 680 H240 L300 620 H540 L620 740 H900 L980 640 H1220 L1300 780 H1920"/>
    <path d="M480 0 V200 L560 280 V1080"/>
    <path d="M1200 0 V160 L1280 240 V1080"/>
  </g>
  <g fill="#7dd3fc" opacity="0.85">
    <circle cx="320" cy="420" r="4"/><circle cx="620" cy="360" r="3"/>
    <circle cx="960" cy="480" r="5"/><circle cx="1280" cy="380" r="3"/>
    <circle cx="540" cy="620" r="4"/><circle cx="900" cy="740" r="3"/>
    <circle cx="560" cy="280" r="3"/><circle cx="1280" cy="240" r="4"/>
  </g>
  <!-- Crystal shards -->
  <g opacity="0.15" fill="#bae6fd">
    <polygon points="1400,180 1520,120 1580,220 1460,280"/>
    <polygon points="200,760 320,700 360,820 240,880"/>
    <polygon points="860,140 940,90 990,170 910,220"/>
  </g>
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.35"/>
</svg>
