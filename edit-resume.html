<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="base-path" content="/" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a1018" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f0ebe3" media="(prefers-color-scheme: light)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gal Jacobson" />
  <link rel="manifest" href="manifest.json" />
  <title>Gal Jacobson — Edit Resume</title>
  <link rel="icon" href="assets/images/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/images/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
  <script src="js/theme-boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/resume.css?v=admin-mobile-3" />
  <link rel="stylesheet" href="css/edit-resume.css?v=admin-mobile-3" />
</head>
<body class="edit-resume-page">
  <div id="editor-gate"></div>
  <div id="editor-root" class="edit-layout" data-mobile-pane="form" hidden>
    <aside class="edit-panel">
      <div class="edit-panel-head">
        <h1>Edit resume</h1>
        <div class="edit-mobile-tabs" role="tablist" aria-label="Editor views">
          <button type="button" class="edit-mobile-tab is-active" role="tab" aria-selected="true" data-edit-pane="form">Edit</button>
          <button type="button" class="edit-mobile-tab" role="tab" aria-selected="false" data-edit-pane="preview">Preview</button>
        </div>
        <a class="resume-btn" href="resume.html">← Resume</a>
      </div>
      <div class="edit-profile-switch" role="tablist" aria-label="Which resume to edit">
        <button type="button" class="edit-profile-tab is-active" data-profile="gal" role="tab" aria-selected="true">Gal Jacobson</button>
        <button type="button" class="edit-profile-tab" data-profile="liat" role="tab" aria-selected="false">Liat Shalev</button>
      </div>
      <p class="edit-profile-note" id="edit-profile-note" hidden></p>
      <p class="edit-status" id="edit-status" hidden></p>
      <div class="edit-actions">
        <button type="button" class="edit-publish-toggle" id="publish-option" aria-pressed="true" title="Publish to Github" aria-label="Publish to Github">
          <span class="edit-publish-github-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          </span>
        </button>
        <button class="resume-btn resume-btn--primary" type="submit" form="edit-form" id="save-resume">Save</button>
        <button class="resume-btn" type="button" id="reset-draft">Reset</button>
        <button class="resume-btn" type="button" id="download-resume-pdf">Download PDF</button>
        <button class="resume-btn" type="button" id="export-json">Export JSON</button>
      </div>
      <div class="publish-token-panel" id="publish-token-panel" hidden>
        <p class="publish-token-copy">
          One-time setup: paste a fine-grained GitHub token with
          <strong>Contents: Read and write</strong> on <code>JacobsonGal/JacobsonGal.github.io</code>.
          It is stored in this browser so every edit commits live to GitHub Pages.
          <a id="publish-token-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">Create token</a>
        </p>
        <label class="publish-token-label" for="publish-token-input">GitHub publish token</label>
        <div class="publish-token-row">
          <input id="publish-token-input" class="publish-token-input" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" />
          <button type="button" class="resume-btn resume-btn--primary" id="publish-token-save">Save &amp; go live</button>
        </div>
      </div>
      <form class="edit-form" id="edit-form">
        <label>Name<input name="name" required /></label>
        <label>Headline<input name="headline" required /></label>
        <label>Email<input name="email" type="email" required /></label>
        <label>Phone (resume only)<input name="phone" /></label>
        <label>Location<input name="location" /></label>
        <label>Overview (one paragraph per line)<textarea name="about" rows="6"></textarea></label>
        <label>Hard skills (one group per line)<textarea name="hardSkills" rows="8"></textarea></label>
        <label>Soft skills (one per line)<textarea name="softSkills" rows="5"></textarea></label>
        <label>Portfolio URL<input name="portfolio" /></label>
        <label>LinkedIn URL<input name="linkedin" /></label>
        <label>GitHub URL<input name="github" /></label>
        <div class="edit-extra-fields" id="edit-extra-fields" hidden>
          <label>Work experience (one role per block, blank line between roles)<textarea name="experience" rows="10" placeholder="Title | Company | Dates | Location&#10;- First achievement&#10;- Second achievement"></textarea></label>
          <label>Education (one per line: Degree | School | Dates | Field)<textarea name="education" rows="5" placeholder="BSc Computer Science | Tel Aviv University | 2018 — 2021 | Software Engineering"></textarea></label>
        </div>
      </form>
    </aside>
    <section class="edit-preview">
      <iframe id="preview-frame" title="Resume preview"></iframe>
    </section>
  </div>
  <script type="module" src="js/edit-resume-app.js?v=admin-mobile-3"></script>
</body>
</html>
